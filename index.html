<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Calculator</title>
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <main class="calculator">
      <h1>Calculator</h1>
      <input id="first-number" type="number" placeholder="First number" />
      <input id="second-number" type="number" placeholder="Second number" />

      <div class="calculator__buttons">
        <button id="add-button">Add</button>
        <button id="subtract-button">Subtract</button>
        <button id="multiply-button">Multiply</button>
        <button id="divide-button">Divide</button>
      </div>

      <p id="result">Result: 0</p>
    </main>

    <script src="./index.js"></script>
  </body>
</html>
